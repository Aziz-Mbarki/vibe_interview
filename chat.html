<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ask</title>
  <link rel="stylesheet" href="./node_modules/@fortawesome/fontawesome-free/css/all.min.css" />
  <link rel="stylesheet" href="./src/styles/tokens.css" />
  <link rel="stylesheet" href="./src/styles/panel.css" />
  <link rel="stylesheet" href="./node_modules/prismjs/themes/prism-tomorrow.min.css" />
  <style>
    body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
      font-family: var(--font);
      height: 100vh;
      color: var(--text-0);
      user-select: none;
    }

    .panel {
      height: 100vh;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      overflow: hidden;
      background: var(--surface-1);
      backdrop-filter: var(--blur-panel);
      -webkit-backdrop-filter: var(--blur-panel);
      border: 1px solid var(--border-1);
      border-radius: var(--r-panel);
      box-shadow: var(--shadow-panel);
    }

    .chat-messages {
      flex: 1;
      padding: 12px 14px;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-app-region: no-drag;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg {
      max-width: 92%;
      padding: 10px 14px;
      border-radius: var(--r-card);
      font-size: 13px;
      line-height: 1.45;
      word-wrap: break-word;
      word-break: break-word;
      user-select: text;
    }

    .msg.is-user {
      align-self: flex-end;
      background: var(--surface-3);
      color: var(--text-0);
      border-bottom-right-radius: 4px;
      box-shadow: var(--shadow-1);
    }

    .msg.is-ai {
      align-self: flex-start;
      background: var(--surface-2);
      border-left: 3px solid var(--accent);
      border-bottom-left-radius: 4px;
      color: var(--text-1);
      box-shadow: var(--shadow-1);
    }

    .msg.is-system {
      align-self: center;
      background: transparent;
      color: var(--text-3);
      font-size: 11px;
      font-style: italic;
      padding: 4px 8px;
    }

    .msg-meta {
      font-size: 10px;
      color: var(--text-3);
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .codecard {
      margin: 8px 0;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid var(--border-1);
      border-radius: 8px;
      overflow: hidden;
    }

    .codecard-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 10px;
      background: rgba(255, 255, 255, 0.04);
      border-bottom: 1px solid var(--border-0);
      font-size: 10px;
      text-transform: uppercase;
      color: var(--text-2);
    }

    .codecard pre {
      margin: 0;
      padding: 10px;
      overflow-x: auto;
      font-family: 'SF Mono', Consolas, Monaco, monospace;
      font-size: 12px;
      line-height: 1.4;
    }

    .composer {
      padding: 8px 12px 10px;
      -webkit-app-region: no-drag;
      border-top: 1px solid var(--border-0);
      background: var(--surface-1);
    }

    .composer-card {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      padding: 6px 10px;
      background: var(--surface-2);
      border: 1px solid var(--border-1);
      border-radius: var(--r-card);
      transition: border-color var(--t);
    }

    .composer-card:focus-within {
      border-color: var(--accent);
    }

    .composer textarea {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-0);
      font-family: var(--font);
      font-size: 13px;
      outline: none;
      resize: none;
      min-height: 22px;
      max-height: 120px;
      line-height: 1.4;
      box-sizing: border-box;
    }

    .composer textarea::placeholder {
      color: var(--text-3);
    }

    .btn-send {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      border: none;
      background: var(--accent);
      color: #0c0c0e;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 12px;
      transition: transform var(--t), opacity var(--t);
      flex-shrink: 0;
    }

    .btn-send:hover {
      opacity: 0.9;
      transform: scale(1.05);
    }

    .btn-send:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>
  <div class="panel" id="askPanel">
    <!-- Header -->
    <div class="panel-head">
      <div class="panel-title">
        <i class="fas fa-comment-dots" style="color: var(--accent);"></i>
        <span>Ask</span>
      </div>
      <div class="panel-actions">
        <div class="chip is-ok" id="quotaChip">Ready</div>
        <button class="icon-btn" id="detachBtn" title="Detach panel"><i class="fas fa-up-right-from-square"></i></button>
        <button class="icon-btn" id="closeBtn" title="Close"><i class="fas fa-xmark"></i></button>
      </div>
    </div>

    <!-- Body -->
    <div class="panel-body" style="display: flex; flex-direction: column; overflow: hidden; padding: 0;">
      <!-- Context control bar -->
      <div style="padding: 8px 14px 4px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-0);">
        <label style="display: flex; align-items: center; gap: 7px; font-size: 11px; cursor: pointer; color: var(--text-2);">
          <input type="checkbox" id="useListenCtx" checked style="accent-color: var(--accent); cursor: pointer;" />
          <span>Using Listen context</span>
        </label>
        <div style="display: flex; align-items: center; gap: 8px;">
          <span class="chip" id="ctxCount">0 turns</span>
          <button class="icon-btn" id="clearHistoryBtn" title="Clear chat history" style="font-size: 11px; padding: 4px;"><i class="fas fa-trash"></i></button>
        </div>
      </div>

      <!-- Messages list -->
      <div class="chat-messages" id="chatMessages"></div>
    </div>

    <!-- Composer -->
    <div class="composer">
      <div class="composer-card">
        <textarea
          id="messageInput"
          placeholder="Ask anything… (Enter to send, Shift+Enter for newline)"
          rows="1"
        ></textarea>
        <button class="btn-send" id="sendButton" title="Send message">
          <i class="fas fa-arrow-up"></i>
        </button>
      </div>
    </div>

    <!-- Live Activity Bar -->
    <div class="activity">
      <span class="pulse" id="activityPulse"></span>
      <span id="activityText">Ready</span>
    </div>
  </div>

  <script src="lib/markdown.js"></script>
  <script src="./node_modules/prismjs/prism.js"></script>
  <script src="./node_modules/prismjs/plugins/autoloader/prism-autoloader.min.js"></script>

  <script>
    const api = window.electronAPI;

    const chatMessages = document.getElementById('chatMessages');
    const messageInput = document.getElementById('messageInput');
    const sendButton = document.getElementById('sendButton');
    const useListenCtx = document.getElementById('useListenCtx');
    const ctxCount = document.getElementById('ctxCount');
    const clearHistoryBtn = document.getElementById('clearHistoryBtn');
    const detachBtn = document.getElementById('detachBtn');
    const closeBtn = document.getElementById('closeBtn');
    const quotaChip = document.getElementById('quotaChip');
    const activityPulse = document.getElementById('activityPulse');
    const activityText = document.getElementById('activityText');

    let isDetached = false;
    const CHAT_STORAGE_KEY = 'opencluely_ask_history_v2';
    let history = [];

    // Blackout support
    if (api && api.onBlackout) {
      api.onBlackout((isBlackout) => {
        document.documentElement.classList.toggle('blackout', isBlackout);
      });
    }

    // Panel Detach / Attach
    if (detachBtn && api) {
      detachBtn.addEventListener('click', async () => {
        if (isDetached) {
          await api.attachPanel('ask');
          isDetached = false;
          detachBtn.innerHTML = '<i class="fas fa-up-right-from-square"></i>';
          detachBtn.title = 'Detach panel';
        } else {
          await api.detachPanel('ask');
          isDetached = true;
          detachBtn.innerHTML = '<i class="fas fa-arrow-down-to-bracket"></i>';
          detachBtn.title = 'Dock panel';
        }
      });
    }

    // Close button
    if (closeBtn && api) {
      closeBtn.addEventListener('click', () => {
        api.setActivePanel(null);
      });
    }

    // Quota updates
    if (api && api.onQuota) {
      api.onQuota((data) => {
        if (quotaChip && data) {
          quotaChip.textContent = `${data.percentage ?? 0}%`;
        }
      });
    }

    // Activity updates
    if (api && api.onActivity) {
      api.onActivity((data) => {
        if (activityText && data) {
          activityText.textContent = data.detail || 'Ready';
          if (data.stage === 'idle') {
            activityPulse.classList.remove('pulse-accent');
          } else {
            activityPulse.classList.add('pulse-accent');
          }
        }
      });
    }

    // Update Context Turns count
    async function updateContextTurnCount() {
      if (!api || !api.getTranscript) return;
      try {
        const turns = await api.getTranscript(20);
        if (ctxCount && Array.isArray(turns)) {
          ctxCount.textContent = `${turns.length} turns`;
        }
      } catch (_) {}
    }

    setInterval(updateContextTurnCount, 4000);
    updateContextTurnCount();

    // Auto grow textarea
    function autoGrow(el) {
      if (!el) return;
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 120) + 'px';
    }

    if (messageInput) {
      messageInput.addEventListener('input', () => autoGrow(messageInput));
      messageInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });
    }

    if (sendButton) {
      sendButton.addEventListener('click', sendMessage);
    }

    // Format Markdown safely
    function renderMarkdown(text) {
      if (!text) return '';
      try {
        if (typeof markdown !== 'undefined' && markdown.toHTML) {
          return markdown.toHTML(text);
        }
      } catch (_) {}
      return text
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.+?)\*/g, '<em>$1</em>')
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/\n/g, '<br/>');
    }

    // Append a message bubble
    function appendMessage(role, text, skipPersist = false) {
      const msg = document.createElement('div');
      msg.className = `msg ${role === 'user' ? 'is-user' : role === 'assistant' ? 'is-ai' : 'is-system'}`;

      const meta = document.createElement('div');
      meta.className = 'msg-meta';
      meta.innerHTML = `<span>${role.toUpperCase()}</span><span>${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>`;
      msg.appendChild(meta);

      const body = document.createElement('div');
      if (role === 'assistant') {
        body.innerHTML = renderMarkdown(text);
      } else {
        body.textContent = text;
      }
      msg.appendChild(body);

      chatMessages.appendChild(msg);
      chatMessages.scrollTop = chatMessages.scrollHeight;

      if (!skipPersist) {
        history.push({ role, text, timestamp: Date.now() });
        try {
          localStorage.setItem(CHAT_STORAGE_KEY, JSON.stringify(history.slice(-100)));
        } catch (_) {}
      }
    }

    // Load History
    function loadHistory() {
      try {
        const raw = localStorage.getItem(CHAT_STORAGE_KEY);
        if (raw) {
          history = JSON.parse(raw);
          history.forEach(item => appendMessage(item.role, item.text, true));
        }
      } catch (_) {}
    }

    if (clearHistoryBtn) {
      clearHistoryBtn.addEventListener('click', () => {
        history = [];
        localStorage.removeItem(CHAT_STORAGE_KEY);
        chatMessages.innerHTML = '';
        if (api && api.clearSessionMemory) {
          api.clearSessionMemory();
        }
      });
    }

    // Send Message flow
    async function sendMessage() {
      const text = messageInput.value.trim();
      if (!text) return;

      appendMessage('user', text);
      messageInput.value = '';
      autoGrow(messageInput);

      if (activityText) activityText.textContent = 'Thinking…';
      if (activityPulse) activityPulse.classList.add('pulse-accent');

      try {
        const useContext = useListenCtx ? Boolean(useListenCtx.checked) : true;
        if (api && api.sendChatMessage) {
          await api.sendChatMessage(text, useContext);
        }
      } catch (err) {
        appendMessage('system', `Error: ${err.message}`);
      }
    }

    let currentStreamEl = null;
    let currentStreamText = '';

    function ensureStreamBubble() {
      if (currentStreamEl) return currentStreamEl;
      const msg = document.createElement('div');
      msg.className = 'msg is-ai';

      const meta = document.createElement('div');
      meta.className = 'msg-meta';
      meta.innerHTML = `<span>ASSISTANT</span><span>${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>`;
      msg.appendChild(meta);

      const body = document.createElement('div');
      body.className = 'msg-body';
      body.innerHTML = '<span class="pulse pulse-accent" style="display:inline-block; vertical-align:middle; margin-right:4px;"></span> Thinking…';
      msg.appendChild(body);

      chatMessages.appendChild(msg);
      chatMessages.scrollTop = chatMessages.scrollHeight;

      currentStreamEl = body;
      currentStreamText = '';
      return currentStreamEl;
    }

    function appendStreamChunk(delta) {
      if (!delta) return;
      const body = ensureStreamBubble();
      currentStreamText += delta;
      body.innerHTML = renderMarkdown(currentStreamText);
      try {
        if (typeof Prism !== 'undefined' && Prism.highlightAllUnder) {
          Prism.highlightAllUnder(body);
        }
      } catch (_) {}
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function finalizeStreamResponse(fullText) {
      const finalText = fullText || currentStreamText;
      if (!finalText) return;
      if (currentStreamEl) {
        currentStreamEl.innerHTML = renderMarkdown(finalText);
        try {
          if (typeof Prism !== 'undefined' && Prism.highlightAllUnder) {
            Prism.highlightAllUnder(currentStreamEl);
          }
        } catch (_) {}
        history.push({ role: 'assistant', text: finalText, timestamp: Date.now() });
        try {
          localStorage.setItem(CHAT_STORAGE_KEY, JSON.stringify(history.slice(-100)));
        } catch (_) {}
      } else {
        appendMessage('assistant', finalText);
      }
      currentStreamEl = null;
      currentStreamText = '';
      if (activityText) activityText.textContent = 'Ready';
      if (activityPulse) activityPulse.classList.remove('pulse-accent');
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    // Listen to LLM stream responses
    if (api && api.onLlmResponseStart) {
      api.onLlmResponseStart((_e, data) => {
        ensureStreamBubble();
        if (activityText) activityText.textContent = 'Generating…';
        if (activityPulse) activityPulse.classList.add('pulse-accent');
      });
    }

    if (api && api.onLlmResponseChunk) {
      api.onLlmResponseChunk((_e, data) => {
        const delta = typeof data === 'string' ? data : data?.delta;
        appendStreamChunk(delta);
      });
    }

    if (api && api.onLlmResponse) {
      api.onLlmResponse((_e, data) => {
        const text = data?.response || data?.text || data;
        if (text && typeof text === 'string') {
          finalizeStreamResponse(text);
        } else if (data && data.response) {
          finalizeStreamResponse(data.response);
        } else {
          if (activityText) activityText.textContent = 'Ready';
          if (activityPulse) activityPulse.classList.remove('pulse-accent');
        }
      });
    }

    // Also listen to transcription LLM responses
    if (api && api.onTranscriptionLlmResponseStart) {
      api.onTranscriptionLlmResponseStart((_e, data) => {
        if (useListenCtx && useListenCtx.checked) {
          ensureStreamBubble();
        }
      });
    }

    if (api && api.onTranscriptionLlmResponseChunk) {
      api.onTranscriptionLlmResponseChunk((_e, data) => {
        if (currentStreamEl) {
          const delta = typeof data === 'string' ? data : data?.delta;
          appendStreamChunk(delta);
        }
      });
    }

    if (api && api.onTranscriptionLlmResponse) {
      api.onTranscriptionLlmResponse((_e, data) => {
        if (currentStreamEl && (data?.response || data?.text)) {
          finalizeStreamResponse(data.response || data.text);
        }
      });
    }

    if (api && api.onLlmError) {
      api.onLlmError((_e, err) => {
        const errMsg = typeof err === 'string' ? err : err?.error || err?.message || 'LLM generation failed';
        if (currentStreamEl) {
          currentStreamEl.innerHTML = `<span style="color:var(--danger);">Error: ${errMsg}</span>`;
          currentStreamEl = null;
          currentStreamText = '';
        } else {
          appendMessage('system', `Error: ${errMsg}`);
        }
        if (activityText) activityText.textContent = 'Error';
        if (activityPulse) activityPulse.classList.remove('pulse-accent');
      });
    }

    if (api && api.onSessionCleared) {
      api.onSessionCleared(() => {
        history = [];
        chatMessages.innerHTML = '';
        currentStreamEl = null;
        currentStreamText = '';
      });
    }

    loadHistory();
  </script>
</body>
</html>
